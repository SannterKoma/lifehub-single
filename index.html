<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧠 Мой LifeHub</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --indigo: #6366f1;
    --purple: #a855f7;
    --cyan: #06b6d4;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text-primary: #f1f5f9;
    --text-secondary: rgba(241, 245, 249, 0.6);
}

body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    background: #0f0f23;
    color: var(--text-primary);
    /* Статичный, красивый градиент вместо тяжелой анимации */
    background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
    background-attachment: fixed;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 100px;
}

.page-header {
    text-align: center;
    margin-bottom: 24px;
}

.page-header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
}

.page-header p {
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px); /* Уменьшено с 40px для производительности */
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.card-header h2 {
    font-size: 1.2rem;
    font-weight: 600;
}

.badge {
    font-size: 0.7rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.2);
    color: #a5b4fc;
}

.db-table {
    width: 100%;
    border-collapse: collapse;
}

.db-table thead th {
    text-align: left;
    padding: 8px 10px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.db-table tbody tr {
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.db-table tbody td {
    padding: 10px;
    font-size: 0.85rem;
}

.text-secondary { color: var(--text-secondary); font-weight: 400; }

.tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 500;
}
.tag-income { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
.tag-expense { background: rgba(239, 68, 68, 0.15); color: #f87171; }
.tag-category { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
.tag-type { background: rgba(6, 182, 212, 0.15); color: #67e8f9; }
.tag-status { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
.tag-done { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

.tag-multi {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 500;
    margin: 2px;
}
.tag-work { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
.tag-personal { background: rgba(236, 72, 153, 0.15); color: #f9a8d4; }
.tag-ideas { background: rgba(251, 191, 36, 0.15); color: #fde68a; }
.tag-finance { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

.btn-add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--indigo), var(--purple));
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity 0.1s;
}
.btn-add:active { opacity: 0.8; }

.nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: rgba(15, 15, 35, 0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 100;
}

.nav-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.1s;
}

.nav-tab.active {
    color: var(--text-primary);
}

.nav-tab.active .emoji {
    background: rgba(99, 102, 241, 0.2);
    padding: 6px;
    border-radius: 10px;
}

.nav-tab span.emoji { font-size: 1.2rem; transition: background 0.1s; }

.db-section { display: none; }
.db-section.active { display: block; } /* Мгновенное переключение без анимации */

.stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.stat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
}

.stat-value { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
.stat-value.income { color: #4ade80; }
.stat-value.expense { color: #f87171; }
.stat-value.balance { color: #67e8f9; }
.stat-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; }

.formula-value { font-weight: 600; color: #4ade80; }
.formula-negative { color: #f87171; }

.calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.calendar-nav h3 { font-size: 1rem; font-weight: 600; }
.cal-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 20px;
}
.calendar-header-cell {
    text-align: center;
    padding: 6px;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-secondary);
}
.calendar-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.8rem;
    position: relative;
}
.calendar-cell.today { background: rgba(99, 102, 241, 0.25); font-weight: 600; }
.calendar-cell.has-event::after {
    content: '';
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--cyan);
    position: absolute;
    bottom: 4px;
}
.calendar-cell.other-month { color: rgba(255, 255, 255, 0.15); }

.board-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
}
.board-column {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 12px;
}
.board-column-title {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
}
.board-count {
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 0.65rem;
}
.board-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    position: relative;
}
.board-item:active { background: rgba(255, 255, 255, 0.08); }
.board-item-title { font-size: 0.8rem; font-weight: 500; margin-bottom: 4px; }
.board-item-content { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.3; }
.board-item-meta { font-size: 0.65rem; color: var(--text-secondary); }

.table-actions { display: flex; gap: 4px; }
.action-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
}
.action-btn:active { transform: scale(0.9); }
.action-btn.delete:active { background: rgba(239, 68, 68, 0.2); }

.relation-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(168, 85, 247, 0.1);
    color: #c4b5fd;
    font-size: 0.7rem;
}

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 200;
    display: none;
    align-items: flex-end; /* Для мобильного вида снизу */
    justify-content: center;
}
.modal-overlay.active { display: flex; }

.modal {
    background: #1a1a3e;
    border: 1px solid var(--glass-border);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
}
@media (min-width: 768px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 20px; }
}

.modal h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
    text-transform: uppercase;
}
.input-field, .select-field, .textarea-field {
    width: 100%;
    padding: 12px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
}
.input-field:focus, .select-field:focus, .textarea-field:focus {
    border-color: var(--indigo);
}
.select-field {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a5b4fc' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
}
.select-field option { background: #1a1a3e; }
.textarea-field { resize: vertical; min-height: 100px; }

.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
}
.btn-primary { background: linear-gradient(135deg, var(--indigo), var(--purple)); color: white; }
.btn-primary:active { opacity: 0.8; }
.btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.1); }
.btn-secondary:active { background: rgba(255, 255, 255, 0.1); }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

.empty-state { text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 0.85rem; }

/* Notification */
.notification {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    z-index: 1000;
    animation: popIn 0.2s ease-out;
}
@keyframes popIn {
    from { transform: translate(-50%, -20px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}

.sync-status {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 0.65rem;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.2);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 4px;
}
.sync-status::before {
    content: '';
    width: 6px; height: 6px;
    background: #4ade80;
    border-radius: 50%;
}
.sync-status.offline {
    background: rgba(251, 191, 36, 0.15);
    color: #fbbf24;
    border-color: rgba(251, 191, 36, 0.2);
}
.sync-status.offline::before { background: #fbbf24; }
</style>
</head>
<body>

<div class="sync-status" id="sync-status">☁️ Синхронизация</div>

<div class="container">
    <div class="page-header">
        <h1>🧠 Мой LifeHub</h1>
        <p>Центр управления жизнью</p>
    </div>

    <!-- 💰 Финансы -->
    <div class="db-section active" id="section-finance">
        <div class="glass-card">
            <div class="card-header">
                <h2>💰 Финансы</h2>
                <span class="badge">Table</span>
            </div>
            <div class="stats-row" id="finance-stats"></div>
            <div style="overflow-x: auto;">
                <table class="db-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Тип</th>
                            <th>Категория</th>
                            <th>Сумма</th>
                            <th>Итого</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="finance-tbody"></tbody>
                </table>
            </div>
            <button class="btn-add" onclick="openModal('finance')">＋ Добавить запись</button>
        </div>
    </div>

    <!-- 📅 Календарь -->
    <div class="db-section" id="section-calendar">
        <div class="glass-card">
            <div class="card-header">
                <h2>📅 Календарь</h2>
                <span class="badge">Calendar</span>
            </div>
            <div class="calendar-nav">
                <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
                <h3 id="calendar-title"></h3>
                <button class="cal-btn" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-grid" id="calendar"></div>
            <div style="overflow-x: auto;">
                <table class="db-table">
                    <thead>
                        <tr>
                            <th>Событие</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="calendar-tbody"></tbody>
                </table>
            </div>
            <button class="btn-add" onclick="openModal('calendar')">＋ Добавить событие</button>
        </div>
    </div>

    <!-- 📝 Заметки -->
    <div class="db-section" id="section-notes">
        <div class="glass-card">
            <div class="card-header">
                <h2>📝 Заметки</h2>
                <span class="badge">Board</span>
            </div>
            <div class="board-container" id="board-container"></div>
            <button class="btn-add" onclick="openModal('notes')">＋ Добавить заметку</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <button class="nav-tab active" onclick="switchTab('finance', this)">
        <span class="emoji">💰</span>
        <span>Финансы</span>
    </button>
    <button class="nav-tab" onclick="switchTab('calendar', this)">
        <span class="emoji">📅</span>
        <span>Календарь</span>
    </button>
    <button class="nav-tab" onclick="switchTab('notes', this)">
        <span class="emoji">📝</span>
        <span>Заметки</span>
    </button>
</nav>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-content"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

// ==========================================
// ⚠️ ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ FIREBASE
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyDOr6kzxayM7fOwuEs4xvbOCPvqicdh890",
  authDomain: "lifehub28.firebaseapp.com",
  projectId: "lifehub28",
  storageBucket: "lifehub28.firebasestorage.app",
  messagingSenderId: "283957281646",
  appId: "1:283957281646:web:fa59629284fb259ad3377f"
};

let db = null;
let dataRef = null;
let isCloudSync = false;

// Инициализация Firebase или fallback на LocalStorage
try {
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        dataRef = ref(db, 'lifehub_data');
        isCloudSync = true;
        updateSyncStatus(true);
    } else {
        console.warn("Firebase не настроен. Используется локальное хранилище.");
        updateSyncStatus(false);
    }
} catch (e) {
    console.error("Ошибка инициализации Firebase:", e);
    updateSyncStatus(false);
}

let state = { finance: [], calendar: [], notes: [] };
let calendarDate = new Date();

const CATEGORIES = ['ЗП USDT', 'Роялти', 'Еда', 'Транспорт', 'Комиссии', 'Быт', 'Развлечения'];
const EVENT_TYPES = ['Встреча', 'Командировка', 'Дедлайн', 'Личное'];
const TAGS = ['работа', 'личное', 'идеи', 'финансы'];

// Начальные данные (только если хранилище пустое)
function seedData() {
    state.finance = [
        { id: 'f1', date: '2026-09-15', type: 'Доход', category: 'ЗП USDT', amount: 2000, rate: 95.5, fees: 150, comment: 'Зарплата' },
        { id: 'f3', date: '2026-09-10', type: 'Расход', category: 'Еда', amount: 120, rate: 95.5, fees: 0, comment: 'Продукты' }
    ];
    state.calendar = [
        { id: 'c1', title: 'Созвон с командой', datetime: '2026-09-22T10:00', type: 'Встреча', status: 'Запланировано', relationId: null }
    ];
    state.notes = [
        { id: 'n1', title: 'Новый модуль для курса', tags: ['работа', 'идеи'], content: 'Добавить раздел про DeFi', createdAt: Date.now() }
    ];
    saveState();
}

// Сохранение состояния (в облако или локально)
window.saveState = function() {
    if (isCloudSync) {
        set(dataRef, state).catch(err => {
            console.error("Ошибка синхронизации:", err);
            showNotification("Ошибка синхронизации", "error");
        });
    } else {
        localStorage.setItem('lifehub_local', JSON.stringify(state));
    }
}

// Загрузка состояния
function loadState() {
    if (isCloudSync) {
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
                renderAll();
            } else {
                seedData();
            }
        });
    } else {
        const saved = localStorage.getItem('lifehub_local');
        if (saved) {
            try { state = JSON.parse(saved); } catch(e) { seedData(); }
        } else {
            seedData();
        }
        renderAll();
    }
}

function updateSyncStatus(isOnline) {
    const el = document.getElementById('sync-status');
    if (isOnline) {
        el.textContent = '☁️ Синхронизация активна';
        el.classList.remove('offline');
    } else {
        el.textContent = '💾 Локальный режим';
        el.classList.add('offline');
    }
}

// ==========================================
// РЕНДЕРИНГ
// ==========================================
function renderAll() {
    renderFinance();
    renderCalendar();
    renderNotes();
}

function calcFiat(item) {
    return (item.amount * item.rate) - item.fees;
}

function renderFinance() {
    const tbody = document.getElementById('finance-tbody');
    const stats = document.getElementById('finance-stats');
    let totalIncome = 0, totalExpense = 0, totalFiat = 0;
    
    if (state.finance.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Нет записей</td></tr>';
    } else {
        tbody.innerHTML = state.finance.map(item => {
            const fiat = calcFiat(item);
            if (item.type === 'Доход') totalIncome += item.amount;
            else totalExpense += item.amount;
            totalFiat += fiat;
            return `
                <tr>
                    <td class="text-secondary">${item.date.slice(5)}</td>
                    <td><span class="tag ${item.type === 'Доход' ? 'tag-income' : 'tag-expense'}">${item.type}</span></td>
                    <td><span class="tag tag-category">${item.category}</span></td>
                    <td>${item.amount}</td>
                    <td><span class="${fiat >= 0 ? 'formula-value' : 'formula-negative'}">${Math.round(fiat)} ₽</span></td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn" onclick="window.editItem('finance', '${item.id}')">✏️</button>
                            <button class="action-btn delete" onclick="window.confirmDelete('finance', '${item.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
    stats.innerHTML = `
        <div class="stat-card"><div class="stat-value income">+${totalIncome}</div><div class="stat-label">Доход</div></div>
        <div class="stat-card"><div class="stat-value expense">-${totalExpense}</div><div class="stat-label">Расход</div></div>
        <div class="stat-card"><div class="stat-value balance">${Math.round(totalFiat)} ₽</div><div class="stat-label">Итого</div></div>
    `;
}

const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

window.changeMonth = function(delta) {
    calendarDate.setMonth(calendarDate.getMonth() + delta);
    renderCalendar();
}

function renderCalendar() {
    const cal = document.getElementById('calendar');
    document.getElementById('calendar-title').textContent = `${MONTHS[calendarDate.getMonth()]} ${calendarDate.getFullYear()}`;
    const tbody = document.getElementById('calendar-tbody');
    
    const year = calendarDate.getFullYear(), month = calendarDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDay = (firstDay.getDay() + 6) % 7;
    
    const eventDays = new Set();
    state.calendar.forEach(ev => {
        const d = new Date(ev.datetime);
        if (d.getFullYear() === year && d.getMonth() === month) eventDays.add(d.getDate());
    });
    
    let html = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="calendar-header-cell">${d}</div>`).join('');
    const prevLast = new Date(year, month, 0).getDate();
    for (let i = startDay - 1; i >= 0; i--) html += `<div class="calendar-cell other-month">${prevLast - i}</div>`;
    
    const today = new Date();
    for (let d = 1; d <= lastDay.getDate(); d++) {
        const classes = ['calendar-cell'];
        if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) classes.push('today');
        if (eventDays.has(d)) classes.push('has-event');
        html += `<div class="${classes.join(' ')}">${d}</div>`;
    }
    
    const remaining = (7 - ((startDay + lastDay.getDate()) % 7)) % 7;
    for (let i = 1; i <= remaining; i++) html += `<div class="calendar-cell other-month">${i}</div>`;
    cal.innerHTML = html;
    
    if (state.calendar.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Нет событий</td></tr>';
    } else {
        tbody.innerHTML = state.calendar.map(ev => {
            const related = ev.relationId ? state.finance.find(f => f.id === ev.relationId) : null;
            return `
                <tr>
                    <td>${ev.title}<br><small class="text-secondary">${related ? '🔗 ' + related.category : ''}</small></td>
                    <td class="text-secondary">${ev.datetime.slice(5, 16).replace('T', ' ')}</td>
                    <td><span class="tag ${ev.status === 'Сделано' ? 'tag-done' : 'tag-status'}">${ev.status}</span></td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn" onclick="window.editItem('calendar', '${ev.id}')">✏️</button>
                            <button class="action-btn delete" onclick="window.confirmDelete('calendar', '${ev.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
}

function renderNotes() {
    const container = document.getElementById('board-container');
    if (state.notes.length === 0) {
        container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Нет заметок</div>';
        return;
    }
    
    const grouped = {};
    TAGS.forEach(t => grouped[t] = []);
    grouped['другое'] = [];
    state.notes.forEach(n => {
        if (n.tags.length === 0) grouped['другое'].push(n);
        else n.tags.forEach(t => grouped[t] ? grouped[t].push(n) : grouped['другое'].push(n));
    });
    
    container.innerHTML = TAGS.map(tag => {
        const items = grouped[tag];
        const cls = tag === 'работа' ? 'tag-work' : tag === 'личное' ? 'tag-personal' : tag === 'идеи' ? 'tag-ideas' : 'tag-finance';
        return `
            <div class="board-column">
                <div class="board-column-title"><span>#${tag}</span><span class="board-count">${items.length}</span></div>
                ${items.length === 0 ? '<div style="font-size:0.7rem;color:var(--text-secondary);text-align:center;padding:10px;">Пусто</div>' : 
                items.map(n => `
                    <div class="board-item" onclick="window.viewNote('${n.id}')">
                        <div class="board-item-title">${n.title}</div>
                        <div class="board-item-content">${n.content || 'Без содержания'}</div>
                        <div class="board-item-meta">
                            ${n.tags.map(t => `<span class="tag-multi ${t === 'работа' ? 'tag-work' : t === 'личное' ? 'tag-personal' : t === 'идеи' ? 'tag-ideas' : 'tag-finance'}">#${t}</span>`).join('')}
                        </div>
                        <div class="table-actions" style="margin-top:8px; justify-content:flex-end;">
                            <button class="action-btn" onclick="event.stopPropagation(); window.editItem('notes', '${n.id}')">✏️</button>
                            <button class="action-btn delete" onclick="event.stopPropagation(); window.confirmDelete('notes', '${n.id}')">🗑️</button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }).join('');
}

// МОДАЛЬНЫЕ ОКНА И ДЕЙСТВИЯ
// ==========================================
window.switchTab = function(section, btn) {
    document.querySelectorAll('.db-section').forEach(s => s.classList.remove('active'));
    document.getElementById('section-' + section).classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    if (section === 'calendar') renderCalendar();
}

window.openModal = function(type, editId = null) {
    const item = editId ? state[type].find(i => i.id === editId) : null;
    const content = document.getElementById('modal-content');
    let html = `<h3>${item ? '✏️ Редактировать' : '＋ Новая'} запись</h3>`;
    
    if (type === 'finance') {
        html += `
            <div class="form-group"><label>Дата</label><input type="date" class="input-field" id="f-date" value="${item ? item.date : new Date().toISOString().split('T')[0]}"></div>
            <div class="form-group"><label>Тип</label><select class="select-field" id="f-type"><option value="Доход" ${item?.type==='Доход'?'selected':''}>Доход</option><option value="Расход" ${item?.type==='Расход'?'selected':''}>Расход</option></select></div>
            <div class="form-group"><label>Категория</label><select class="select-field" id="f-category">${CATEGORIES.map(c => `<option value="${c}" ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="form-group"><label>Сумма USDT</label><input type="number" class="input-field" id="f-amount" step="0.01" value="${item ? item.amount : ''}"></div>
            <div class="form-group"><label>Курс (₽)</label><input type="number" class="input-field" id="f-rate" step="0.01" value="${item ? item.rate : '95'}"></div>
            <div class="form-group"><label>Комиссии (₽)</label><input type="number" class="input-field" id="f-fees" step="0.01" value="${item ? item.fees : '0'}"></div>
            <div class="form-group"><label>Комментарий</label><textarea class="textarea-field" id="f-comment">${item ? item.comment : ''}</textarea></div>
        `;
    } else if (type === 'calendar') {
        html += `
            <div class="form-group"><label>Название</label><input type="text" class="input-field" id="c-title" value="${item ? item.title : ''}"></div>
            <div class="form-group"><label>Дата и время</label><input type="datetime-local" class="input-field" id="c-datetime" value="${item ? item.datetime : ''}"></div>
            <div class="form-group"><label>Тип</label><select class="select-field" id="c-type">${EVENT_TYPES.map(t => `<option value="${t}" ${item?.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
            <div class="form-group"><label>Статус</label><select class="select-field" id="c-status"><option value="Запланировано" ${item?.status==='Запланировано'?'selected':''}>Запланировано</option><option value="Сделано" ${item?.status==='Сделано'?'selected':''}>Сделано</option></select></div>
            <div class="form-group"><label>Связано с финансами</label><select class="select-field" id="c-relation"><option value="">— Нет —</option>${state.finance.map(f => `<option value="${f.id}" ${item?.relationId===f.id?'selected':''}>${f.category} (${f.amount} USDT)</option>`).join('')}</select></div>
        `;
    } else if (type === 'notes') {
        html += `
            <div class="form-group"><label>Тема</label><input type="text" class="input-field" id="n-title" value="${item ? item.title : ''}"></div>
            <div class="form-group"><label>Теги (через запятую)</label><input type="text" class="input-field" id="n-tags" value="${item ? item.tags.join(', ') : ''}"><small style="color:var(--text-secondary);font-size:0.65rem;">${TAGS.map(t=>'#'+t).join(', ')}</small></div>
            <div class="form-group"><label>Содержание</label><textarea class="textarea-field" id="n-content" style="min-height:120px;">${item ? item.content : ''}</textarea></div>
        `;
    }
    
    html += `
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="window.closeModal()">Отмена</button>
            <button class="btn btn-primary" onclick="window.saveData('${type}', '${editId || ''}')">${item ? 'Сохранить' : 'Добавить'}</button>
        </div>
    `;
    content.innerHTML = html;
    document.getElementById('modal-overlay').classList.add('active');
}

window.closeModal = function() {
    document.getElementById('modal-overlay').classList.remove('active');
}

window.saveData = function(type, editId) {
    let data = {};
    if (type === 'finance') {
        const amount = parseFloat(document.getElementById('f-amount').value) || 0;
        if (!document.getElementById('f-date').value || amount === 0) return showNotification('Заполните дату и сумму', 'error');
        data = {
            date: document.getElementById('f-date').value,
            type: document.getElementById('f-type').value,
            category: document.getElementById('f-category').value,
            amount: amount,
            rate: parseFloat(document.getElementById('f-rate').value) || 0,
            fees: parseFloat(document.getElementById('f-fees').value) || 0,
            comment: document.getElementById('f-comment').value
        };
    } else if (type === 'calendar') {
        if (!document.getElementById('c-title').value || !document.getElementById('c-datetime').value) return showNotification('Заполните название и дату', 'error');
        data = {
            title: document.getElementById('c-title').value.trim(),
            datetime: document.getElementById('c-datetime').value,
            type: document.getElementById('c-type').value,
            status: document.getElementById('c-status').value,
            relationId: document.getElementById('c-relation').value || null
        };
    } else if (type === 'notes') {
        if (!document.getElementById('n-title').value) return showNotification('Введите тему', 'error');
        const tagsRaw = document.getElementById('n-tags').value;
        data = {
            title: document.getElementById('n-title').value.trim(),
            tags: tagsRaw.split(',').map(t => t.trim().replace(/^#/, '').toLowerCase()).filter(t => TAGS.includes(t)),
            content: document.getElementById('n-content').value
        };
        if (!editId) data.createdAt = Date.now();
    }

    if (editId) {
        const index = state[type].findIndex(i => i.id === editId);
        if (index !== -1) state[type][index] = { ...state[type][index], ...data };
    } else {
        data.id = type[0] + Date.now();
        state[type].push(data);
    }
    
    saveState();
    renderAll();
    closeModal();
    showNotification(editId ? 'Обновлено' : 'Добавлено', 'success');
}

window.editItem = function(type, id) {
    openModal(type, id);
}

window.confirmDelete = function(type, id) {
    if (confirm('Удалить эту запись?')) {
        state[type] = state[type].filter(i => i.id !== id);
        saveState();
        renderAll();
        showNotification('Удалено', 'success');
    }
}

window.viewNote = function(id) {
    const note = state.notes.find(n => n.id === id);
    if (!note) return;
    const content = document.getElementById('modal-content');
    const date = new Date(note.createdAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    content.innerHTML = `
        <h3>📝 ${note.title}</h3>
        <div style="margin-bottom:16px;"><small style="color:var(--text-secondary);">Создано: ${date}</small></div>
        <div style="margin-bottom:16px;">${note.tags.map(t => `<span class="tag-multi ${t === 'работа' ? 'tag-work' : t === 'личное' ? 'tag-personal' : t === 'идеи' ? 'tag-ideas' : 'tag-finance'}">#${t}</span>`).join('')}</div>
        <div style="background:rgba(0,0,0,0.2); padding:16px; border-radius:10px; line-height:1.5; white-space:pre-wrap; margin-bottom:20px;">${note.content || 'Без содержания'}</div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="window.closeModal()">Закрыть</button>
            <button class="btn btn-primary" onclick="window.closeModal(); window.editItem('notes', '${note.id}')">Редактировать</button>
        </div>
    `;
    document.getElementById('modal-overlay').classList.add('active');
}

function showNotification(message, type) {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'notification';
    el.style.background = type === 'success' ? 'rgba(34, 197, 94, 0.2)' : 'rgba(239, 68, 68, 0.2)';
    el.style.color = type === 'success' ? '#4ade80' : '#f87171';
    el.style.border = `1px solid ${type === 'success' ? 'rgba(34, 197, 94, 0.3)' : 'rgba(239, 68, 68, 0.3)'}`;
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

loadState();
