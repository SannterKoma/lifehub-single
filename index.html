<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧠 Мой LifeHub</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --indigo: #6366f1;
    --purple: #a855f7;
    --cyan: #06b6d4;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text-primary: #f1f5f9;
    --text-secondary: rgba(241, 245, 249, 0.6);
}

body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    background: #0f0f23;
    color: var(--text-primary);
    background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
    background-attachment: fixed;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 100px;
}

.page-header {
    text-align: center;
    margin-bottom: 24px;
}

.page-header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
}

.page-header p {
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.card-header h2 {
    font-size: 1.2rem;
    font-weight: 600;
}

.badge {
    font-size: 0.7rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.2);
    color: #a5b4fc;
}

.db-table {
    width: 100%;
    border-collapse: collapse;
}

.db-table thead th {
    text-align: left;
    padding: 8px 10px;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.db-table tbody tr {
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.db-table tbody td {
    padding: 10px;
    font-size: 0.85rem;
}

.text-secondary { color: var(--text-secondary); font-weight: 400; }

.tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 500;
}
.tag-income { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
.tag-expense { background: rgba(239, 68, 68, 0.15); color: #f87171; }
.tag-category { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
.tag-type { background: rgba(6, 182, 212, 0.15); color: #67e8f9; }
.tag-status { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
.tag-done { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
.tag-usdt { background: rgba(6, 182, 212, 0.15); color: #67e8f9; }
.tag-rub { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

.tag-multi {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 500;
    margin: 2px;
}
.tag-work { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
.tag-personal { background: rgba(236, 72, 153, 0.15); color: #f9a8d4; }
.tag-ideas { background: rgba(251, 191, 36, 0.15); color: #fde68a; }
.tag-finance { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

.marker-red { background: rgba(239, 68, 68, 0.3); border-left: 3px solid #ef4444; }
.marker-blue { background: rgba(59, 130, 246, 0.3); border-left: 3px solid #3b82f6; }
.marker-green { background: rgba(34, 197, 94, 0.3); border-left: 3px solid #22c55e; }
.marker-purple { background: rgba(168, 85, 247, 0.3); border-left: 3px solid #a855f7; }
.marker-yellow { background: rgba(251, 191, 36, 0.3); border-left: 3px solid #fbbf24; }
.marker-orange { background: rgba(251, 144, 56, 0.3); border-left: 3px solid #fb9038; }

.btn-add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--indigo), var(--purple));
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity 0.1s;
}
.btn-add:active { opacity: 0.8; }

.nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: rgba(15, 15, 35, 0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 100;
}

.nav-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.1s;
}

.nav-tab.active {
    color: var(--text-primary);
}

.nav-tab.active .emoji {
    background: rgba(99, 102, 241, 0.2);
    padding: 6px;
    border-radius: 10px;
}

.nav-tab span.emoji { 
    font-size: 1.2rem; 
    transition: background 0.1s;
    display: inline-block;
}

.db-section { display: none; }
.db-section.active { display: block; }

.stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.stat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
}

.stat-value { font-size: 1rem; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
.stat-value.income { color: #4ade80; }
.stat-value.expense { color: #f87171; }
.stat-value.balance { color: #67e8f9; }
.stat-value.balance.positive { color: #4ade80; }
.stat-value.balance.negative { color: #f87171; }
.stat-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; }

.formula-value { font-weight: 600; color: #4ade80; cursor: pointer; transition: all 0.2s; }
.formula-negative { color: #f87171; cursor: pointer; transition: all 0.2s; }
.formula-value:hover, .formula-negative:hover {
    background: rgba(255, 255, 255, 0.1);
    padding: 4px 8px;
    border-radius: 6px;
    margin: -4px -8px;
}

.calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.calendar-nav h3 { font-size: 1rem; font-weight: 600; }
.cal-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 20px;
}
.calendar-header-cell {
    text-align: center;
    padding: 6px;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-secondary);
}
.calendar-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.75rem;
    position: relative;
    cursor: default;
    padding: 2px;
}
.calendar-cell.clickable {
    cursor: pointer;
}
.calendar-cell.clickable:hover {
    background: rgba(99, 102, 241, 0.15);
}
.calendar-cell.today { background: rgba(99, 102, 241, 0.25); font-weight: 600; }
.calendar-cell.has-event {
    position: relative;
}
.calendar-cell .event-marker {
    position: absolute;
    bottom: 3px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
}
.calendar-cell.other-month { color: rgba(255, 255, 255, 0.15); }

.board-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
}
.board-column {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 12px;
}
.board-column-title {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
}
.board-count {
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 0.65rem;
}
.board-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    position: relative;
}
.board-item:active { background: rgba(255, 255, 255, 0.08); }
.board-item-title { font-size: 0.8rem; font-weight: 500; margin-bottom: 4px; }
.board-item-content { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.3; }
.board-item-meta { font-size: 0.65rem; color: var(--text-secondary); }

.table-actions { display: flex; gap: 4px; }
.action-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
}
.action-btn:active { transform: scale(0.9); }
.action-btn.delete:active { background: rgba(239, 68, 68, 0.2); }

.relation-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(168, 85, 247, 0.1);
    color: #c4b5fd;
    font-size: 0.7rem;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
}
.modal-overlay.active { display: flex; }

.modal {
    background: #1a1a3e;
    border: 1px solid var(--glass-border);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
}
@media (min-width: 768px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 20px; }
}

.modal h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
    text-transform: uppercase;
}
.input-field, .select-field, .textarea-field {
    width: 100%;
    padding: 12px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
}
.input-field:focus, .select-field:focus, .textarea-field:focus {
    border-color: var(--indigo);
}
.select-field {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a5b4fc' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
}
.select-field option { background: #1a1a3e; }
.textarea-field { resize: vertical; min-height: 100px; }

.tags-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 8px;
}

.tag-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.tag-checkbox:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
}

.tag-checkbox input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--indigo);
}

.tag-checkbox label {
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    margin: 0;
    text-transform: none;
    color: var(--text-primary);
}

.tag-checkbox.work { border-color: rgba(99, 102, 241, 0.3); }
.tag-checkbox.work input:checked { accent-color: var(--indigo); }
.tag-checkbox.work input:checked + label { color: #a5b4fc; }

.tag-checkbox.personal { border-color: rgba(236, 72, 153, 0.3); }
.tag-checkbox.personal input:checked { accent-color: #ec4899; }
.tag-checkbox.personal input:checked + label { color: #f9a8d4; }

.tag-checkbox.ideas { border-color: rgba(251, 191, 36, 0.3); }
.tag-checkbox.ideas input:checked { accent-color: #fbbf24; }
.tag-checkbox.ideas input:checked + label { color: #fde68a; }

.tag-checkbox.finance { border-color: rgba(34, 197, 94, 0.3); }
.tag-checkbox.finance input:checked { accent-color: #22c55e; }
.tag-checkbox.finance input:checked + label { color: #4ade80; }

.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
}
.btn-primary { background: linear-gradient(135deg, var(--indigo), var(--purple)); color: white; }
.btn-primary:active { opacity: 0.8; }
.btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.1); }
.btn-secondary:active { background: rgba(255, 255, 255, 0.1); }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

.empty-state { text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 0.85rem; }

.notification {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    z-index: 1000;
    animation: popIn 0.2s ease-out;
    max-width: 90%;
    text-align: center;
}
.notification.error {
    animation: popIn 0.2s ease-out, shake 0.5s ease-in-out;
}
@keyframes popIn {
    from { transform: translate(-50%, -20px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}
@keyframes shake {
    0%, 100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 10px)); }
    75% { transform: translateX(calc(-50% + 10px)); }
}

.sync-status {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 0.65rem;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.2);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 4px;
}
.sync-status::before {
    content: '';
    width: 6px; height: 6px;
    background: #4ade80;
    border-radius: 50%;
}
.sync-status.offline {
    background: rgba(251, 191, 36, 0.15);
    color: #fbbf24;
    border-color: rgba(251, 191, 36, 0.2);
}
.sync-status.offline::before { background: #fbbf24; }

.currency-field { display: none; }
.currency-field.active { display: block; }

.event-popup-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
}
.event-popup-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 4px;
}
.event-popup-time {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
}
.event-popup-desc {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.4;
}

.comment-popup {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
}
.comment-popup-title {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-secondary);
}
.comment-popup-text {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-primary);
    white-space: pre-wrap;
}
</style>
</head>
<body>

<div class="sync-status" id="sync-status">💾 Локальный режим</div>

<div class="container">
    <div class="page-header">
        <h1>🧠 Мой LifeHub</h1>
        <p>Центр управления жизнью</p>
    </div>

    <div class="db-section active" id="section-finance">
        <div class="glass-card">
            <div class="card-header">
                <h2>💰 Финансы</h2>
                <span class="badge">Table</span>
            </div>
            <div class="stats-row" id="finance-stats"></div>
            <div style="overflow-x: auto;">
                <table class="db-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Тип</th>
                            <th>Валюта</th>
                            <th>Категория</th>
                            <th>Сумма</th>
                            <th>Итого</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="finance-tbody"></tbody>
                </table>
            </div>
            <button class="btn-add" onclick="openModal('finance')">＋ Добавить запись</button>
        </div>
    </div>

    <div class="db-section" id="section-calendar">
        <div class="glass-card">
            <div class="card-header">
                <h2>📅 Календарь</h2>
                <span class="badge">Calendar</span>
            </div>
            <div class="calendar-nav">
                <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
                <h3 id="calendar-title"></h3>
                <button class="cal-btn" onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-grid" id="calendar"></div>
            <div style="overflow-x: auto;">
                <table class="db-table">
                    <thead>
                        <tr>
                            <th>Событие</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="calendar-tbody"></tbody>
                </table>
            </div>
            <button class="btn-add" onclick="openModal('calendar')">＋ Добавить событие</button>
        </div>
    </div>

    <div class="db-section" id="section-notes">
        <div class="glass-card">
            <div class="card-header">
                <h2>📝 Заметки</h2>
                <span class="badge">Board</span>
            </div>
            <div class="board-container" id="board-container"></div>
            <button class="btn-add" onclick="openModal('notes')">＋ Добавить заметку</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <button class="nav-tab active" onclick="switchTab('finance', this)">
        <span class="emoji">💰</span>
        <span>Финансы</span>
    </button>
    <button class="nav-tab" onclick="switchTab('calendar', this)">
        <span class="emoji">📅</span>
        <span>Календарь</span>
    </button>
    <button class="nav-tab" onclick="switchTab('notes', this)">
        <span class="emoji">📝</span>
        <span>Заметки</span>
    </button>
</nav>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-content"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDOr6kzxayM7fOwuEs4xvbOCPvqicdh890",
  authDomain: "lifehub28.firebaseapp.com",
  databaseURL: "https://lifehub28-default-rtdb.firebaseio.com",
  projectId: "lifehub28",
  storageBucket: "lifehub28.firebasestorage.app",
  messagingSenderId: "283957281646",
  appId: "1:283957281646:web:fa59629284fb259ad3377f"
};

let db = null;
let dataRef = null;
let isCloudSync = false;

let state = { 
    finance: [], 
    calendar: [], 
    notes: [] 
};

const CATEGORIES = ['ЗП USDT', 'Роялти', 'Еда', 'Продукты', 'Нужды', 'Долги', 'Транспорт', 'Комиссии', 'Быт', 'Развлечения'];
const CURRENCIES = ['USDT', 'RUB'];
const EVENT_TYPES = ['Встреча', 'Командировка', 'Дедлайн', 'Личное'];
const TAGS = [
    { id: 'работа', label: '💼 Работа', class: 'work' },
    { id: 'личное', label: '❤️ Личное', class: 'personal' },
    { id: 'идеи', label: '💡 Идеи', class: 'ideas' },
    { id: 'финансы', label: '💰 Финансы', class: 'finance' }
];

function ensureState() {
    if (!state || typeof state !== 'object') {
        state = { finance: [], calendar: [], notes: [] };
    }
    if (!Array.isArray(state.finance)) state.finance = [];
    if (!Array.isArray(state.calendar)) state.calendar = [];
    if (!Array.isArray(state.notes)) state.notes = [];
}

function checkFirebaseConfig() {
    return firebaseConfig.apiKey && 
           firebaseConfig.apiKey !== "ВСТАВЬ_СЮДА" && 
           firebaseConfig.apiKey !== "YOUR_API_KEY" &&
           firebaseConfig.apiKey.length > 10;
}

async function initFirebase() {
    if (!checkFirebaseConfig()) {
        console.log("Firebase не настроен, используем localStorage");
        updateSyncStatus(false);
        loadLocalState();
        return;
    }

    try {
        const firebaseApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
        const firebaseDb = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js");
        
        const app = firebaseApp.initializeApp(firebaseConfig);
        db = firebaseDb.getDatabase(app);
        dataRef = firebaseDb.ref(db, 'lifehub_data');
        isCloudSync = true;
        
        updateSyncStatus(true);
        loadCloudState();
    } catch (error) {
        console.error("Ошибка Firebase:", error);
        updateSyncStatus(false);
        loadLocalState();
    }
}

function updateSyncStatus(isOnline) {
    const el = document.getElementById('sync-status');
    if (isOnline) {
        el.textContent = '☁️ Синхронизация';
        el.classList.remove('offline');
    } else {
        el.textContent = '💾 Локально';
        el.classList.add('offline');
    }
}

function saveState() {
    ensureState();
    
    if (isCloudSync && dataRef) {
        import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js").then(fb => {
            fb.set(dataRef, state).catch(err => {
                console.error("Ошибка сохранения:", err);
                showNotification("Ошибка синхронизации", "error");
            });
        });
    } else {
        try {
            localStorage.setItem('lifehub_local', JSON.stringify(state));
        } catch (e) {
            console.error("Ошибка localStorage:", e);
            showNotification("Ошибка сохранения: " + e.message, "error");
        }
    }
}

function loadLocalState() {
    ensureState();
    const saved = localStorage.getItem('lifehub_local');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === 'object') {
                state.finance = Array.isArray(parsed.finance) ? parsed.finance : [];
                state.calendar = Array.isArray(parsed.calendar) ? parsed.calendar : [];
                state.notes = Array.isArray(parsed.notes) ? parsed.notes : [];
            } else {
                seedData();
            }
        } catch(e) {
            console.error("Ошибка парсинга:", e);
            seedData();
        }
    } else {
        seedData();
    }
    renderAll();
}

function loadCloudState() {
    ensureState();
    import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js").then(fb => {
        fb.onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data && typeof data === 'object') {
                state.finance = Array.isArray(data.finance) ? data.finance : [];
                state.calendar = Array.isArray(data.calendar) ? data.calendar : [];
                state.notes = Array.isArray(data.notes) ? data.notes : [];
            } else {
                seedData();
            }
            renderAll();
        }, (error) => {
            console.error("Ошибка загрузки из Firebase:", error);
            loadLocalState();
        });
    }).catch(err => {
        console.error("Ошибка импорта Firebase:", err);
        loadLocalState();
    });
}

    ];

function calcFiat(item) {
    if (item.currency === 'RUB') {
        return item.amount - item.fees;
    } else {
        return (item.amount * item.rate) - item.fees;
    }
}

function renderFinance() {
    ensureState();
    const tbody = document.getElementById('finance-tbody');
    const stats = document.getElementById('finance-stats');
    let totalIncomeUSDT = 0, totalExpenseUSDT = 0;
    let totalIncomeRUB = 0, totalExpenseRUB = 0;
    let totalIncomeFiat = 0, totalExpenseFiat = 0;
    
    if (!state.finance || state.finance.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Нет записей</td></tr>';
    } else {
        tbody.innerHTML = state.finance.map(item => {
            const fiat = calcFiat(item);
            
            if (item.currency === 'USDT') {
                if (item.type === 'Доход') totalIncomeUSDT += item.amount;
                else totalExpenseUSDT += item.amount;
            } else {
                if (item.type === 'Доход') totalIncomeRUB += item.amount;
                else totalExpenseRUB += item.amount;
            }
            
            if (item.type === 'Доход') totalIncomeFiat += fiat;
            else totalExpenseFiat += fiat;
            
            const currencyTag = item.currency === 'USDT' ? 'tag-usdt' : 'tag-rub';
            
            return `
                <tr>
                    <td class="text-secondary">${item.date.slice(5)}</td>
                    <td><span class="tag ${item.type === 'Доход' ? 'tag-income' : 'tag-expense'}">${item.type}</span></td>
                    <td><span class="tag ${currencyTag}">${item.currency}</span></td>
                    <td><span class="tag tag-category">${item.category}</span></td>
                    <td>${item.amount} ${item.currency}</td>
                    <td><span class="${fiat >= 0 ? 'formula-value' : 'formula-negative'}" onclick="showComment('${item.id}')">${Math.round(fiat)} ₽ </span></td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn" onclick="editItem('finance', '${item.id}')">✏️</button>
                            <button class="action-btn delete" onclick="confirmDelete('finance', '${item.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    const balance = totalIncomeFiat - totalExpenseFiat;
    const balanceClass = balance >= 0 ? 'balance positive' : 'balance negative';
    const balanceSign = balance >= 0 ? '+' : '';
    
    stats.innerHTML = `
        <div class="stat-card">
            <div class="stat-value income">+${totalIncomeUSDT} USDT<br>+${totalIncomeRUB} ₽</div>
            <div class="stat-label">Доходы</div>
        </div>
        <div class="stat-card">
            <div class="stat-value expense">-${totalExpenseUSDT} USDT<br>-${totalExpenseRUB} ₽</div>
            <div class="stat-label">Расходы</div>
        </div>
        <div class="stat-card">
            <div class="stat-value ${balanceClass}">${balanceSign}${Math.round(balance)} ₽</div>
            <div class="stat-label">Баланс</div>
        </div>
    `;
}

const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

function changeMonth(delta) {
    calendarDate.setMonth(calendarDate.getMonth() + delta);
    renderCalendar();
}

function renderCalendar() {
    ensureState();
    const cal = document.getElementById('calendar');
    document.getElementById('calendar-title').textContent = `${MONTHS[calendarDate.getMonth()]} ${calendarDate.getFullYear()}`;
    const tbody = document.getElementById('calendar-tbody');
    
    const year = calendarDate.getFullYear(), month = calendarDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDay = (firstDay.getDay() + 6) % 7;
    
    const eventsByDay = {};
    if (state.calendar) {
        state.calendar.forEach(ev => {
            const d = new Date(ev.datetime);
            if (d.getFullYear() === year && d.getMonth() === month) {
                const day = d.getDate();
                if (!eventsByDay[day]) eventsByDay[day] = [];
                eventsByDay[day].push(ev);
            }
        });
    }
    
    let html = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="calendar-header-cell">${d}</div>`).join('');
    const prevLast = new Date(year, month, 0).getDate();
    for (let i = startDay - 1; i >= 0; i--) html += `<div class="calendar-cell other-month">${prevLast - i}</div>`;
    
    const today = new Date();
    for (let d = 1; d <= lastDay.getDate(); d++) {
        const classes = ['calendar-cell'];
        if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) classes.push('today');
        
        const dayEvents = eventsByDay[d] || [];
        if (dayEvents.length > 0) {
            classes.push('has-event');
            classes.push('clickable');
        }
        
        let cellContent = `<span>${d}</span>`;
        if (dayEvents.length > 0) {
            const markers = dayEvents.slice(0, 3).map((ev, idx) => {
                const colorMap = {
                    'blue': '#3b82f6',
                    'red': '#ef4444',
                    'green': '#22c55e',
                    'purple': '#a855f7',
                    'yellow': '#fbbf24',
                    'orange': '#fb9038'
                };
                const color = colorMap[ev.markerColor] || '#3b82f6';
                return `<div class="event-marker" style="background: ${color}; left: ${20 + idx * 8}px;"></div>`;
            }).join('');
            cellContent += markers;
        }
        
        const hasEvents = dayEvents.length > 0;
        html += `<div class="${classes.join(' ')}" ${hasEvents ? `onclick="showDayEvents(${year}, ${month}, ${d})"` : ''}>${cellContent}</div>`;
    }
    
    const remaining = (7 - ((startDay + lastDay.getDate()) % 7)) % 7;
    for (let i = 1; i <= remaining; i++) html += `<div class="calendar-cell other-month">${i}</div>`;
    cal.innerHTML = html;
    
    if (!state.calendar || state.calendar.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Нет событий</td></tr>';
    } else {
        tbody.innerHTML = state.calendar.map(ev => {
            const related = ev.relationId ? state.finance.find(f => f.id === ev.relationId) : null;
            return `
                <tr>
                    <td>${ev.title}<br><small class="text-secondary">${related ? ' ' + related.category : ''}</small></td>
                    <td class="text-secondary">${ev.datetime.slice(5, 16).replace('T', ' ')}</td>
                    <td><span class="tag ${ev.status === 'Сделано' ? 'tag-done' : 'tag-status'}">${ev.status}</span></td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn" onclick="editItem('calendar', '${ev.id}')">✏️</button>
                            <button class="action-btn delete" onclick="confirmDelete('calendar', '${ev.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
}

function showDayEvents(year, month, day) {
    const events = state.calendar.filter(ev => {
        const d = new Date(ev.datetime);
        return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
    });
    
    if (events.length === 0) return;
    
    const content = document.getElementById('modal-content');
    const dateStr = `${day} ${MONTHS[month].toLowerCase()} ${year}`;
    
    let html = `<h3> ${dateStr}</h3>`;
    html += `<div style="margin-bottom:16px;color:var(--text-secondary);font-size:0.85rem;">Событий: ${events.length}</div>`;
    
    events.forEach(ev => {
        const time = ev.datetime.slice(11, 16);
        const related = ev.relationId ? state.finance.find(f => f.id === ev.relationId) : null;
        const colorMap = {
            'blue': 'marker-blue',
            'red': 'marker-red',
            'green': 'marker-green',
            'purple': 'marker-purple',
            'yellow': 'marker-yellow',
            'orange': 'marker-orange'
        };
        const colorClass = colorMap[ev.markerColor] || 'marker-blue';
        html += `
            <div class="event-popup-item ${colorClass}">
                <div class="event-popup-title">${ev.title}</div>
                <div class="event-popup-time">🕐 ${time} · <span class="tag tag-type" style="font-size:0.65rem;">${ev.type}</span> · <span class="tag ${ev.status === 'Сделано' ? 'tag-done' : 'tag-status'}" style="font-size:0.65rem;">${ev.status}</span></div>
                ${ev.description ? `<div class="event-popup-desc">${ev.description}</div>` : ''}
                ${related ? `<div class="event-popup-desc" style="margin-top:6px;">🔗 Связано: ${related.category} (${related.amount} ${related.currency})</div>` : ''}
            </div>
        `;
    });
    
    html += `
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
        </div>
    `;
    
    content.innerHTML = html;
    document.getElementById('modal-overlay').classList.add('active');
}

function renderNotes() {
    ensureState();
    const container = document.getElementById('board-container');
    
    if (!container) return;
    
    if (!state.notes || state.notes.length === 0) {
        container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Нет заметок</div>';
        return;
    }
    
    const grouped = {};
    TAGS.forEach(t => grouped[t.id] = []);
    grouped['другое'] = [];
    
    state.notes.forEach(n => {
        if (!n.tags || n.tags.length === 0) {
            grouped['другое'].push(n);
        } else {
            n.tags.forEach(t => {
                if (grouped[t]) grouped[t].push(n);
                else grouped['другое'].push(n);
            });
        }
    });
    
    container.innerHTML = TAGS.map(tag => {
        const items = grouped[tag.id];
        return `
            <div class="board-column">
                <div class="board-column-title"><span>${tag.label}</span><span class="board-count">${items.length}</span></div>
                ${items.length === 0 ? '<div style="font-size:0.7rem;color:var(--text-secondary);text-align:center;padding:10px;">Пусто</div>' : 
                items.map(n => {
                    const related = n.relationId ? state.finance.find(f => f.id === n.relationId) : null;
                    return `
                    <div class="board-item" onclick="viewNote('${n.id}')">
                        <div class="board-item-title">${n.title}</div>
                        <div class="board-item-content">${n.content || 'Без содержания'}</div>
                        ${related ? `<div style="font-size:0.65rem;color:#a5b4fc;margin-bottom:4px;">🔗 ${related.category}</div>` : ''}
                        <div class="board-item-meta">
                            ${n.tags.map(t => {
                                const tagInfo = TAGS.find(tt => tt.id === t);
                                const cls = tagInfo ? tagInfo.class : '';
                                return `<span class="tag-multi tag-${cls}">#${t}</span>`;
                            }).join('')}
                        </div>
                        <div class="table-actions" style="margin-top:8px; justify-content:flex-end;">
                            <button class="action-btn" onclick="event.stopPropagation(); editItem('notes', '${n.id}')">✏️</button>
                            <button class="action-btn delete" onclick="event.stopPropagation(); confirmDelete('notes', '${n.id}')">🗑️</button>
                        </div>
                    </div>
                `}).join('')}
            </div>
        `;
    }).join('');
}

                </div>
            </div>
            <div class="form-group"><label>Содержание</label><textarea class="textarea-field" id="n-content" style="min-height:120px;">${item && item.content ? item.content : ''}</textarea></div>
            <div class="form-group"><label>Связано с финансами</label><select class="select-field" id="n-relation"><option value="">— Нет —</option>${state.finance.map(f => `<option value="${f.id}" ${item && item.relationId===f.id?'selected':''}>${f.category} (${f.amount} ${f.currency})</option>`).join('')}</select></div>
        `;
    }
    
    html += `
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
            <button class="btn btn-primary" onclick="saveData('${type}', '${editId || ''}')">${item ? 'Сохранить' : 'Добавить'}</button>
        </div>
    `;
    content.innerHTML = html;
    document.getElementById('modal-overlay').classList.add('active');
}

function toggleCurrencyFields() {
    const currency = document.getElementById('f-currency').value;
    const rateGroup = document.getElementById('f-rate-group');
    if (currency === 'USDT') {
        rateGroup.classList.add('active');
    } else {
        rateGroup.classList.remove('active');
    }
}

function updateMarkerColor() {
    const type = document.getElementById('c-type').value;
    const colorMap = {
        'Встреча': 'blue',
        'Командировка': 'purple',
        'Дедлайн': 'red',
        'Личное': 'green'
    };
    document.getElementById('c-markerColor').value = colorMap[type] || 'blue';
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
}

function saveData(type, editId) {
    ensureState();
    
    let data = {};
    try {
        if (type === 'finance') {
            const amount = parseFloat(document.getElementById('f-amount').value) || 0;
            const date = document.getElementById('f-date').value;
            const currency = document.getElementById('f-currency').value;
            
            if (!date || amount === 0) {
                showNotification('Заполните дату и сумму', 'error');
                return;
            }
            
            data = {
                date: date,
                type: document.getElementById('f-type').value,
                currency: currency,
                category: document.getElementById('f-category').value,
                amount: amount,
                fees: parseFloat(document.getElementById('f-fees').value) || 0,
                comment: document.getElementById('f-comment').value
            };
            
            if (currency === 'USDT') {
                data.rate = parseFloat(document.getElementById('f-rate').value) || 0;
            } else {
                data.rate = 1;
            }
        } else if (type === 'calendar') {
            const title = document.getElementById('c-title').value.trim();
            const datetime = document.getElementById('c-datetime').value;
            if (!title || !datetime) {
                showNotification('Заполните название и дату', 'error');
                return;
            }
            data = {
                title: title,
                datetime: datetime,
                type: document.getElementById('c-type').value,
                status: document.getElementById('c-status').value,
                description: document.getElementById('c-description').value.trim(),
                markerColor: document.getElementById('c-markerColor').value,
                relationId: document.getElementById('c-relation').value || null
            };
        } else if (type === 'notes') {
            const title = document.getElementById('n-title').value.trim();
            if (!title) {
                showNotification('Введите тему заметки', 'error');
                return;
            }
            
            const selectedTags = [];
            TAGS.forEach(tag => {
                const checkbox = document.getElementById(`tag-${tag.id}`);
                if (checkbox && checkbox.checked) {
                    selectedTags.push(tag.id);
                }
            });
            
            data = {
                title: title,
                tags: selectedTags,
                content: document.getElementById('n-content').value || '',
                relationId: document.getElementById('n-relation').value || null
            };
            
            if (!editId) {
                data.createdAt = Date.now();
            }
        }

        if (!state[type]) {
            state[type] = [];
        }

        if (editId) {
            const index = state[type].findIndex(i => i.id === editId);
            if (index !== -1) {
                state[type][index] = { ...state[type][index], ...data };
            }
        } else {
            data.id = type[0] + Date.now();
            state[type].push(data);
        }
        
        saveState();
        renderAll();
        closeModal();
        showNotification(editId ? '✅ Обновлено' : '✅ Добавлено', 'success');
    } catch (error) {
        console.error('Ошибка сохранения:', error);
        showNotification('❌ Ошибка: ' + error.message, 'error');
    }
}

function editItem(type, id) {
    openModal(type, id);
}

function confirmDelete(type, id) {
    ensureState();
    if (confirm('Удалить эту запись?')) {
        if (state[type]) {
            state[type] = state[type].filter(i => i.id !== id);
            saveState();
            renderAll();
            showNotification('️ Удалено', 'success');
        }
    }
}

function viewNote(id) {
    ensureState();
    const note = state.notes.find(n => n.id === id);
    if (!note) return;
    const content = document.getElementById('modal-content');
    const date = new Date(note.createdAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    const related = note.relationId ? state.finance.find(f => f.id === note.relationId) : null;
    
    content.innerHTML = `
        <h3>📝 ${note.title}</h3>
        <div style="margin-bottom:16px;"><small style="color:var(--text-secondary);">Создано: ${date}</small></div>
        <div style="margin-bottom:16px;">${note.tags.map(t => {
            const tagInfo = TAGS.find(tt => tt.id === t);
            const cls = tagInfo ? tagInfo.class : '';
            return `<span class="tag-multi tag-${cls}">#${t}</span>`;
        }).join('')}</div>
        ${related ? `<div style="margin-bottom:16px;padding:10px;background:rgba(168,85,247,0.1);border-radius:8px;"><small style="color:#c4b5fd;">🔗 Связано с финансами: ${related.category} (${related.amount} ${related.currency})</small></div>` : ''}
        <div style="background:rgba(0,0,0,0.2); padding:16px; border-radius:10px; line-height:1.5; white-space:pre-wrap; margin-bottom:20px;">${note.content || 'Без содержания'}</div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
            <button class="btn btn-primary" onclick="closeModal(); editItem('notes', '${note.id}')">Редактировать</button>
        </div>
    `;
    document.getElementById('modal-overlay').classList.add('active');
}

function showNotification(message, type) {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'notification' + (type === 'error' ? ' error' : '');
    el.style.background = type === 'success' ? 'rgba(34, 197, 94, 0.2)' : 'rgba(239, 68, 68, 0.2)';
    el.style.color = type === 'success' ? '#4ade80' : '#f87171';
    el.style.border = `1px solid ${type === 'success' ? 'rgba(34, 197, 94, 0.3)' : 'rgba(239, 68, 68, 0.3)'}`;
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

initFirebase();
</script>
</body>
</html>
